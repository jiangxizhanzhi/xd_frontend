stages:
  - build
  - site

variables:
  GIT_SSL_NO_VERIFY: "1"
  PROJECT_NAME: "cyber-ui"

site:
  stage: site
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - yarn install
    - yarn style
    - yarn run site
    - rm -rf /usr/share/nginx/html/$PROJECT_NAME/
    - mkdir /usr/share/nginx/html/$PROJECT_NAME/
    - cp -r dist/* /usr/share/nginx/html/$PROJECT_NAME
    - cp -f nginx/*.conf /etc/nginx/default.d
