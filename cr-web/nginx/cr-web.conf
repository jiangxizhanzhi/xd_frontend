location /page/cr {
    index index.html;
    alias /usr/share/nginx/html/cr-web;
    try_files $uri $uri/ /page/cr/index.html;
}

location /api/cr/ws/ {
    proxy_pass http://10.100.2.21/api/cr/ws/;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

location ^~ /api/cr {
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_redirect off;
    proxy_pass http://10.100.2.21/api/cr;
}
