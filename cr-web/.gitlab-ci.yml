stages:
  - build
  # - site
  - '10.100.1.14'

variables:
  GIT_SSL_NO_VERIFY: '1'
  PROJECT_NAME: 'cr-web'


build:
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
  script:
    - yarn install
    - yarn run build
  artifacts:
    paths:
      - dist

