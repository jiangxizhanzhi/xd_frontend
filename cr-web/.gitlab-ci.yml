'10.100.1.14':
  stage: '10.100.1.14'
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
  script:
    - mv dist $PROJECT_NAME
    - ssh root@10.100.1.14 "rm -rf /home/apps/pages/$PROJECT_NAME/*"
    - scp -r $PROJECT_NAME root@10.100.1.14:/home/apps/pages/
